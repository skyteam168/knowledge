# Frontend nginx for API horizontal scale (pair with docker-compose.ha-api.yml).
# Uses Docker embedded DNS + variables so upstream IPs re-resolve when backend
# replicas are scaled or recreated (plain proxy_pass caches IP at start).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Docker Compose DNS
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $ekb_api backend:8000;
    proxy_pass http://$ekb_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location /oidc/ {
    set $ekb_api backend:8000;
    proxy_pass http://$ekb_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(health|ready)$ {
    set $ekb_api backend:8000;
    proxy_pass http://$ekb_api;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
