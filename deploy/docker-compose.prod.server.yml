# Production on an existing host (e.g. 10.10.130.170) that already runs PostgreSQL + Redis.
# Does NOT start postgres/redis containers. MySQL is unused by this stack.
#
# Usage (on the Linux server):
#   cp .env.prod.server.example .env.prod.server   # fill secrets + PG/Redis
#   # create DBs: CREATE DATABASE ekb; CREATE DATABASE keycloak;
#   docker compose -f docker-compose.prod.server.yml --env-file .env.prod.server up -d --build --wait
#
# host.docker.internal -> host gateway (Docker 20.10+). Point POSTGRES_HOST/REDIS_HOST at it
# when PG/Redis listen on the host, or use the LAN IP if they listen on 10.10.130.170.
name: ekb-prod

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-backend-env: &backend-env
  APP_ENV: prod
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:?}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ekb}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@${REDIS_HOST:?}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  MINIO_BUCKET: ${MINIO_BUCKET:-ekb-documents}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?}
  PDF_PARSER: ${PDF_PARSER:-auto}
  MINERU_API_URL: ${MINERU_API_URL:-}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?}
  OPENSEARCH_URL: http://opensearch:9200
  OPENSEARCH_REPLICAS: ${OPENSEARCH_REPLICAS:-0}
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ekb}
  KEYCLOAK_AUDIENCE: ekb-backend
  CORS_ORIGINS: '["${PUBLIC_URL:?}"]'
  LLM_PROVIDER: openai
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?}
  EMBEDDING_DIM: ${EMBEDDING_DIM:?}
  EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
  RERANK_BASE_URL: ${RERANK_BASE_URL:?}
  RERANK_MODEL: ${RERANK_MODEL:?}
  RERANK_PATH: ${RERANK_PATH:-/reranks}
  RERANK_INSTRUCT: ${RERANK_INSTRUCT:-}
  CHAT_BASE_URL: ${CHAT_BASE_URL:?}
  CHAT_MODEL: ${CHAT_MODEL:?}
  CHAT_FALLBACK_BASE_URL: ${CHAT_FALLBACK_BASE_URL:-}
  CHAT_FALLBACK_MODEL: ${CHAT_FALLBACK_MODEL:-}
  CHAT_EXTRA_BODY: ${CHAT_EXTRA_BODY:-{}}
  CHAT_EVIDENCE_MIN_SCORE: ${CHAT_EVIDENCE_MIN_SCORE:-0.45}
  CHAT_EVIDENCE_CONFIDENT_SCORE: ${CHAT_EVIDENCE_CONFIDENT_SCORE:-0.7}
  CHAT_ANSWER_IMAGES_ENABLED: ${CHAT_ANSWER_IMAGES_ENABLED:-true}
  CHAT_ANSWER_IMAGES_PER_MATERIAL: ${CHAT_ANSWER_IMAGES_PER_MATERIAL:-2}
  CHAT_ANSWER_IMAGES_TOTAL: ${CHAT_ANSWER_IMAGES_TOTAL:-6}
  OPEN_API_ENABLED: ${OPEN_API_ENABLED:-true}
  OPEN_API_KEY_PEPPER: ${OPEN_API_KEY_PEPPER:?}
  OPEN_API_TRUSTED_PROXIES: ${OPEN_API_TRUSTED_PROXIES:-[]}
  LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
  INDEX_ALIAS: ${INDEX_ALIAS:-kb_chunks}
  DIRECTORY_SECRET_KEY: ${DIRECTORY_SECRET_KEY:?}
  DIRECTORY_SYNC_MAX_DISABLE_RATIO: ${DIRECTORY_SYNC_MAX_DISABLE_RATIO:-0.2}
  PUBLIC_BASE_URL: ${PUBLIC_URL:?}
  OIDC_BRIDGE_ENABLED: ${OIDC_BRIDGE_ENABLED:-true}
  OIDC_BRIDGE_SIGNING_KEY: ${OIDC_BRIDGE_SIGNING_KEY:?}
  OIDC_BRIDGE_CLIENT_SECRET: ${OIDC_BRIDGE_CLIENT_SECRET:?}
  OIDC_BRIDGE_INTERNAL_URL: ${OIDC_BRIDGE_INTERNAL_URL:-http://backend:8000}
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-ekb-backend}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_USER_REQUESTS: ${RATE_LIMIT_USER_REQUESTS:-300}
  RATE_LIMIT_ORG_REQUESTS: ${RATE_LIMIT_ORG_REQUESTS:-3000}
  RATE_LIMIT_CHAT_USER_REQUESTS: ${RATE_LIMIT_CHAT_USER_REQUESTS:-20}
  RATE_LIMIT_CHAT_ORG_REQUESTS: ${RATE_LIMIT_CHAT_ORG_REQUESTS:-300}
  VIRUS_SCAN_BACKEND: ${VIRUS_SCAN_BACKEND:-none}
  METRICS_TOKEN: ${METRICS_TOKEN:?}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  minio:
    <<: [*restart, *logging, *host-gateway]
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: ["silo", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "${MINIO_BIND:-0.0.0.0}:${MINIO_HOST_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    <<: [*restart, *logging]
    image: qdrant/qdrant:v1.13.6
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
    volumes:
      - qdrant_data:/qdrant/storage
      - ${BACKUP_DIR:-./backups}/qdrant:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch:
    <<: [*restart, *logging]
    build:
      context: ./opensearch
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-2.19.2}
    image: ekb/opensearch-ik:${OPENSEARCH_VERSION:-2.19.2}
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      path.repo: /usr/share/opensearch/snapshots
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os_data:/usr/share/opensearch/data
      - ./opensearch/analysis:/usr/share/opensearch/config/analysis:ro
      - ${BACKUP_DIR:-./backups}/opensearch:/usr/share/opensearch/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  keycloak:
    <<: [*restart, *logging, *host-gateway]
    image: quay.io/keycloak/keycloak:26.2
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:?}:${POSTGRES_PORT:-5432}/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      EKB_PUBLIC_BASE_URL: ${PUBLIC_URL:?}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
    ports:
      # Host 8080/8081 may already be taken; map KEYCLOAK_HOST_PORT (default 8082) -> container 8080.
      - "${KEYCLOAK_BIND:-0.0.0.0}:${KEYCLOAK_HOST_PORT:-8082}:8080"
    volumes:
      - ${KEYCLOAK_REALM_FILE:-./keycloak/realm-ekb.prod.json}:/opt/keycloak/data/import/realm-ekb.json:ro
      - ./keycloak/themes/ekb:/opt/keycloak/themes/ekb:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "\"UP\"" <&3'
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  migrate:
    <<: [*logging, *host-gateway]
    build:
      context: ../backend
      target: api
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    image: ${REGISTRY:-ekb}/backend:${TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    restart: "no"

  backend:
    <<: [*restart, *logging, *host-gateway]
    image: ${REGISTRY:-ekb}/backend:${TAG:-latest}
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak-setup:
    <<: [*logging, *host-gateway]
    image: ${REGISTRY:-ekb}/backend:${TAG:-latest}
    command: ["python", "-m", "app.cli", "keycloak", "setup-idp"]
    environment:
      <<: *backend-env
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  worker:
    <<: [*restart, *logging, *host-gateway]
    build:
      context: ../backend
      target: worker
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    image: ${REGISTRY:-ekb}/backend-worker:${TAG:-latest}
    command:
      - dramatiq
      - app.workers.main
      - --processes
      - "${WORKER_PROCESSES:-2}"
      - --threads
      - "${WORKER_THREADS:-4}"
    environment:
      <<: *backend-env
      WORKER_METRICS_PORT: "9191"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  outbox-dispatcher:
    <<: [*restart, *logging, *host-gateway]
    image: ${REGISTRY:-ekb}/backend-worker:${TAG:-latest}
    command: ["python", "-m", "app.workers.outbox_dispatcher"]
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "app.workers.outbox_dispatcher"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    <<: [*restart, *logging, *host-gateway]
    image: ${REGISTRY:-ekb}/backend-worker:${TAG:-latest}
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "app.workers.scheduler"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    <<: [*restart, *logging]
    build:
      context: ../frontend
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:?}
    image: ${REGISTRY:-ekb}/frontend:${TAG:-latest}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully

  backup-postgres:
    <<: [*restart, *logging, *host-gateway]
    image: postgres:16-alpine
    command: ["sh", "/scripts/pg-backup.sh"]
    environment:
      PGHOST: ${POSTGRES_HOST:?}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_DATABASES: ${POSTGRES_DB:-ekb} keycloak
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups

  backup-minio:
    <<: [*restart, *logging]
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["sh", "/scripts/minio-backup.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: ${MINIO_BUCKET:-ekb-documents}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
  qdrant_data:
  os_data:
