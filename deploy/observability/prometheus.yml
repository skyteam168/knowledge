global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ekb-backend
    metrics_path: /metrics
    # Same value as METRICS_TOKEN (file: deploy/observability/metrics-token, not committed).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["backend:8000"]

  - job_name: ekb-worker
    static_configs:
      - targets: ["worker:9191"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
