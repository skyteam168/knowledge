server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Direct (non-presigned) document uploads go through /api; keep in sync with UPLOAD_MAX_BYTES.
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the backend trusts this header (IP allowlists, audit IPs), so a
    # client-supplied X-Forwarded-For must not survive the hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    # SSE answers stream token by token.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # WeCom / DingTalk scan login (OIDC bridge used by Keycloak); browser-facing endpoints.
  location /oidc/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(health|ready)$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # Hashed build output: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
